<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Attributes and Input Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            width: 400px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border: 1px solid black;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>Form Attributes and Input Validation</h1>

    <form action="#" method="post">

        <h2>Student Registration Form</h2>

        <label for="name">Full Name:</label>
        <input type="text"
               id="name"
               name="name"
               required
               minlength="3"
               maxlength="30">

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               required>

        <label for="phone">Phone Number:</label>
        <input type="tel"
               id="phone"
               name="phone"
               pattern="[0-9]{10}"
               placeholder="Enter 10 digit number"
               required>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password"
               minlength="6"
               maxlength="15"
               placeholder="Minimum 6 characters"
               required>

        <label for="age">Age:</label>
        <input type="number"
               id="age"
               name="age"
               min="17"
               max="30"
               required>

        <label for="date">Date of Birth:</label>
        <input type="date"
               id="date"
               name="date"
               required>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
