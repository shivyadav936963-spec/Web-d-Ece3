<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h1>Hyperlinks and Images with Attributes</h1>

    <h2>1. Hyperlinks</h2>

    <p>Click the following links:</p>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>
    <br><br>

    <a href="https://www.youtube.com" target="_blank">
        Visit YouTube
    </a>
    <br><br>

    <a href="https://www.wikipedia.org" target="_blank">
        Visit Wikipedia
    </a>

    <hr>

    <h2>2. Images with Attributes</h2>

    <p>Example of an image with width, height and alt attributes:</p>

    <img src="https://picsum.photos/300/200"
         width="300"
         height="200"
         alt="Sample Image"
         title="Beautiful Image">

    <br><br>

    <h2>3. Image as a Hyperlink</h2>

    <a href="https://www.google.com" target="_blank">
        <img src="https://picsum.photos/150/100"
             width="150"
             height="100"
             alt="Google Image">
    </a>

</body>
</html>
