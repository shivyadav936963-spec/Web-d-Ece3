<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Accessibility</title>
</head>

<body>

    <header>
        <h1>HTML Accessibility</h1>
        <p>Making websites accessible to everyone.</p>
    </header>

    <hr>

    <nav aria-label="Main Navigation">
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <main>

        <section id="home">
            <h2>1. Accessible Image</h2>

            <img src="https://picsum.photos/300/200"
                 alt="Beautiful nature scenery"
                 width="300"
                 height="200">
        </section>

        <hr>

        <section id="about">
            <h2>2. Accessible Form</h2>

            <form>

                <label for="name">Enter Your Name:</label>
                <input type="text" id="name"
                       name="name" required>

                <br><br>

                <label for="email">Enter Your Email:</label>
                <input type="email" id="email"
                       name="email" required>

                <br><br>

                <button type="submit">Submit</button>

            </form>
        </section>

        <hr>

        <section>
            <h2>3. Accessible Button</h2>

            <button type="button"
                    aria-label="Click to learn more">
                Learn More
            </button>
        </section>

        <hr>

        <section id="contact">
            <h2>4. Contact Information</h2>

            <p>
                Email:
                <a href="mailto:shiv@example.com">
                    Contact Us
                </a>
            </p>
        </section>

    </main>

    <footer>
        <p>Created by Shiv Yadav</p>
    </footer>

</body>
</html>
