<!DOCTYPE html>
<html>
<head>
    <title>Multimedia in HTML</title>
</head>
<body>

    <h1>Multimedia: Image, Video, Audio and YouTube</h1>

    <hr>

    <h2>1. Image</h2>

    <img src="https://picsum.photos/400/250"
         width="400"
         height="250"
         alt="Sample Image">

    <hr>

    <h2>2. Video</h2>

    <video width="400" height="250" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4"
                type="video/mp4">
        
    </video>

    <hr>

    <h2>3. Audio</h2>

    <audio controls>
        <source src="https://www.samplefiles.online/files/sample.mp3"
                type="audio/mpeg">
    
    </audio>

    <hr>

    <h2>4. YouTube Video</h2>

    <iframe width="400"
            height="250"
            src=https://youtube.com/shorts/95-Xs6piOas
            title="YouTube Video"
            allowfullscreen>
    </iframe>

</body>
</html>
