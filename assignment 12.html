<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>

<body>

    <h1>Table with Headers, Caption and Footer</h1>

    <table border="1" cellpadding="10" cellspacing="0">

        <caption><b>Student Marks Details</b></caption>

        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Shiv Yadav</td>
                <td>HTML</td>
                <td>85</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Aman</td>
                <td>JavaScript</td>
                <td>80</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Total Marks</th>
                <th>255</th>
            </tr>
        </tfoot>

    </table>

</body>
</html>
